<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#202227;-webkit-font-smoothing:antialiased}a{color:#5CC8C2}a:hover{color:#8EDDD8}</style>
</helmet>
<div style="padding:80px;display:flex;flex-direction:column;gap:110px;font-family:Inter,system-ui,sans-serif;color:#E8E6E1;width:max-content;min-height:100vh;background:#202227;font-size:13px">
  <div style="display:flex;align-items:center;gap:16px">
    <dc-import name="LumenMark" size="{{ 40 }}" hint-size="40px,40px"></dc-import>
    <div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:26px;font-weight:600;letter-spacing:-.04em">lumen <span style="color:#7D7A73;font-weight:450;letter-spacing:-.01em">/ {{ pageTitle }}</span></div><div style="font-size:14px;color:#9A9890;max-width:1100px">{{ pageDesc }}</div></div>
  </div>
  <section style="display:{{ fixS }};flex-direction:column;gap:14px;max-width:1100px">
    <div style="font:500 12px 'JetBrains Mono',monospace;color:#F25C9A;letter-spacing:.08em">{{ fixH }}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 28px;font-size:14px;line-height:21px;color:#CFCBC3"><sc-for list="{{ fixes }}" as="f"><div style="display:flex;gap:10px"><b style="color:#F25C9A">·</b><span><b style="color:#ECE9E2">{{ f.a }}</b> {{ f.b }}</span></div></sc-for></div>
  </section>
  <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="2">
    <section style="display:flex;flex-direction:column;gap:28px">
      <div style="display:flex;flex-direction:column;gap:6px;max-width:960px"><div style="font:500 12px 'JetBrains Mono',monospace;color:#F25C9A;letter-spacing:.08em">{{ sec.k }}</div><h2 style="margin:0;font-size:32px;font-weight:650;letter-spacing:-.02em;color:#ECE9E2">{{ sec.t }}</h2><p style="margin:0;color:#9A9890;font-size:15px;line-height:24px">{{ sec.d }}</p></div>
      <div style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">
        <sc-for list="{{ sec.frames }}" as="f" hint-placeholder-count="2">
          <div style="display:flex;flex-direction:column;gap:12px">
            <div style="font:500 13px 'JetBrains Mono',monospace;color:#B9B5AC;white-space:nowrap"><span style="color:#F25C9A">{{ f.id }}</span> {{ f.l }}</div>
            <div style="--bg:{{ f.t.bg }};--sf:{{ f.t.sf }};--sf2:{{ f.t.sf2 }};--bd:{{ f.t.bd }};--tx:{{ f.t.tx }};--mu:{{ f.t.mu }};--ac:{{ f.t.ac }};--af:{{ f.t.af }};--ln:{{ f.t.ln }};--ok:{{ f.t.ok }};--wa:{{ f.t.wa }};--da:{{ f.t.da }};--le:{{ f.t.le }};width:{{ f.w }};height:{{ f.h }};position:relative;overflow:hidden;border-radius:{{ f.r }};background:var(--bg)">
              <dc-import name="VersionStudio" screen="{{ f.o.s }}" dmode="{{ f.o.dm }}" phone="{{ f.ph }}" light="{{ f.light }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import>
            </div>
            <div style="max-width:{{ f.w }};font-size:13px;line-height:20px;color:#CFCBC3;display:{{ f.nS }};gap:10px"><b style="color:#F25C9A">·</b><span>{{ f.n }}</span></div>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const L = { bg:'#0F1115', sf:'#161A21', sf2:'#1D222B', bd:'#2A303B', tx:'#E8E6E1', mu:'#9AA0AA', ac:'#F2A93B', af:'#1A1206', ln:'#5CC8C2', ok:'#6BCB8B', wa:'#E8B34A', da:'#EF6B6B', le:'#B48EF0' };
    const P = { bg:'#FAF8F3', sf:'#FFFFFF', sf2:'#F2EFE7', bd:'#E4DFD3', tx:'#1F1D1A', mu:'#6A655C', ac:'#B45F0E', af:'#FFFFFF', ln:'#0F7C78', ok:'#1F8A4C', wa:'#A86A00', da:'#C42B2B', le:'#7A4BD1' };
    const F = (id, l, t, n, o = {}) => ({ id, l, t, n, nS: n ? 'flex' : 'none', o, ph: !!o.ph, light: t === P, w: o.ph ? '412px' : '1440px', h: o.ph ? '915px' : (o.h || '900px'), r: o.ph ? '28px' : '12px' });

    const sections = [
      { k:'NOTE HISTORY', t:'History and diff', d:'History groups quiet autosaves into sessions (“12 edits, 14:02–14:40”) and marks named, synced, AI and restore versions differently. Selecting one shows a word-level diff against now.', frames:[
        F('58A','Inline diff', L, 'Restore makes a new version, so nothing is lost. Restore selection takes back only the lines you pick.', { s:'history' }),
        F('58B','Side by side · Paper', P, '', { s:'history', dm:'Side by side' }),
        F('58C','Compare any two', L, 'Pick any two versions, including a named one.', { s:'compare' }),
        F('58D','Name this version', L, 'Named versions are kept forever. They are also made automatically before AI edits, restores and conversions.', { s:'name' })
      ]},
      { k:'SYNC', t:'Sync conflicts', d:'Edits from two devices are merged automatically. If the same block changed on both, you see this once.', frames:[ F('58E','Conflict', L, '', { s:'conflict' }) ]},
      { k:'DOCUMENTS', t:'Document versions', d:'PDFs, images and office files keep numbered versions with labels (Sent to supervisor, Reviewed). Compare pages side by side or overlaid.', frames:[
        F('58F','PDF v4 → v5', L, '', { s:'doc' }), F('58G','PDF · Paper', P, '', { s:'doc' }) ]},
      { k:'SETTINGS', t:'How long versions are kept', d:'', frames:[ F('58H','Versions & history settings', L, '', { s:'settings' }) ]},
      { k:'PHONE', t:'Phone', d:'', frames:[ F('58I','History', L, '', { s:'history', ph:1 }), F('58J','Conflict', L, '', { s:'conflict', ph:1 }), F('58K','Document versions', L, '', { s:'doc', ph:1 }), F('58L','Name version', L, '', { s:'name', ph:1 }) ]}
    ];
    return { sections, fixes: [], fixS: 'none', fixH: '', pageTitle: '58 Versioning', pageDesc: 'Note history with word-level diff, named versions, compare, sync conflicts, document versions and settings for how long versions are kept.' };
  }
}
</script>
</body>
</html>
