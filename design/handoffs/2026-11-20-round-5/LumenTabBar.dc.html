<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://unpkg.com/lucide-static@0.460.0/font/lucide.css">
</helmet>
<div style="height:88px;background:var(--sf);border-top:1px solid var(--bd);display:flex;flex-direction:column;font-family:Inter,system-ui,sans-serif;box-sizing:border-box;flex-shrink:0">
  <div style="height:64px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:{{ hc }}"><div style="width:56px;height:28px;border-radius:14px;background:{{ hb }};display:flex;align-items:center;justify-content:center"><i class="icon-house" style="font-size:20px"></i></div><span style="font-size:11px;font-weight:{{ hw }}">Home</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:{{ nc }}"><div style="width:56px;height:28px;border-radius:14px;background:{{ nb }};display:flex;align-items:center;justify-content:center"><i class="icon-file-text" style="font-size:20px"></i></div><span style="font-size:11px;font-weight:{{ nw }}">Notes</span></div>
    <div style="display:flex;justify-content:center"><div style="width:56px;height:56px;border-radius:18px;background:var(--ac);color:var(--af);display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 0 0 5px var(--bg)"><i class="icon-plus" style="font-size:26px"></i></div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:{{ rc }}"><div style="position:relative;width:56px;height:28px;border-radius:14px;background:{{ rb }};display:flex;align-items:center;justify-content:center"><i class="icon-layers" style="font-size:20px"></i><span style="position:absolute;top:-3px;right:6px;min-width:18px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--le);color:#14101C;font-size:10px;font-weight:700;line-height:16px;text-align:center">23</span></div><span style="font-size:11px;font-weight:{{ rw }}">Review</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:{{ mc }}"><div style="width:56px;height:28px;border-radius:14px;background:{{ mb }};display:flex;align-items:center;justify-content:center"><i class="icon-layout-grid" style="font-size:20px"></i></div><span style="font-size:11px;font-weight:{{ mw }}">More</span></div>
  </div>
  <div style="height:24px;display:flex;align-items:center;justify-content:center"><div style="width:108px;height:4px;border-radius:2px;background:var(--mu);opacity:.45"></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:88},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;notes&quot;,&quot;review&quot;,&quot;more&quot;,&quot;none&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const v = {};
    [['h','home'],['n','notes'],['r','review'],['m','more']].forEach(([p,k]) => {
      v[p+'c'] = k===a ? 'var(--tx)' : 'var(--mu)';
      v[p+'b'] = k===a ? 'color-mix(in srgb,var(--ac) 18%,transparent)' : 'transparent';
      v[p+'w'] = k===a ? 600 : 500;
    });
    return v;
  }
}
</script>
</body>
</html>
