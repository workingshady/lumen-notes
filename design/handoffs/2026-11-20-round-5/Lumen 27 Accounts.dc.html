<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#202227;-webkit-font-smoothing:antialiased}a{color:#5CC8C2}a:hover{color:#8EDDD8}</style>
</helmet>
<div style="padding:80px;display:flex;flex-direction:column;gap:110px;font-family:Inter,system-ui,sans-serif;color:#E8E6E1;width:max-content;min-height:100vh;background:#202227;font-size:13px">
  <div style="display:flex;align-items:center;gap:16px">
    <dc-import name="LumenMark" size="{{ 40 }}" hint-size="40px,40px"></dc-import>
    <div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:26px;font-weight:600;letter-spacing:-.04em">lumen <span style="color:#7D7A73;font-weight:450;letter-spacing:-.01em">/ 27 Accounts</span> <span style="font:600 11px Inter;letter-spacing:.08em;color:#1A1206;background:#F2A93B;padding:3px 8px;border-radius:6px;vertical-align:middle">ROUND 5</span></div><div style="font-size:14px;color:#9A9890">Built behind a switch, off until launch. Every screen in two states: <b style="color:#E8E6E1">Not active (now)</b> — passcode only, with a quiet note — and <b style="color:#E8E6E1">Active (later)</b>. No buttons that do nothing.</div></div>
  </div>
  <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="4">
    <section style="display:flex;flex-direction:column;gap:28px">
      <div style="display:flex;flex-direction:column;gap:6px;max-width:960px"><div style="font:500 12px 'JetBrains Mono',monospace;color:#F25C9A;letter-spacing:.08em">{{ sec.k }}</div><h2 style="margin:0;font-size:32px;font-weight:650;letter-spacing:-.02em;color:#ECE9E2">{{ sec.t }}</h2><p style="margin:0;color:#9A9890;font-size:15px;line-height:24px">{{ sec.d }}</p></div>
      <div style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">
        <sc-for list="{{ sec.frames }}" as="f" hint-placeholder-count="4">
          <div style="display:flex;flex-direction:column;gap:12px">
            <div style="font:500 13px 'JetBrains Mono',monospace;color:#B9B5AC;white-space:nowrap"><span style="color:#F25C9A">{{ f.id }}</span> {{ f.l }}</div>
            <div style="--bg:{{ f.t.bg }};--sf:{{ f.t.sf }};--sf2:{{ f.t.sf2 }};--bd:{{ f.t.bd }};--tx:{{ f.t.tx }};--mu:{{ f.t.mu }};--ac:{{ f.t.ac }};--af:{{ f.t.af }};--ln:{{ f.t.ln }};--ok:{{ f.t.ok }};--wa:{{ f.t.wa }};--da:{{ f.t.da }};--in:{{ f.t.inn }};--le:{{ f.t.le }};--sh:none;width:{{ f.w }};height:{{ f.h }};position:relative;overflow:hidden;border-radius:{{ f.r }};background:var(--bg)">
              <dc-import name="AccountDesk" screen="{{ f.s }}" phone="{{ f.ph }}" light="{{ f.li }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import>
            </div>
            <div style="max-width:{{ f.w }};font-size:13px;line-height:20px;color:#CFCBC3;display:{{ f.nS }};gap:10px"><b style="color:#F25C9A">·</b><span>{{ f.n }}</span></div>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const L = { bg:'#0F1115', sf:'#161A21', sf2:'#1D222B', bd:'#2A303B', tx:'#E8E6E1', mu:'#9AA0AA', ac:'#F2A93B', af:'#1A1206', ln:'#5CC8C2', ok:'#6BCB8B', wa:'#E8B34A', da:'#EF6B6B', inn:'#7AA2F7', le:'#B48EF0' };
    const P = { bg:'#FAF8F3', sf:'#FFFFFF', sf2:'#F2EFE7', bd:'#E4DFD3', tx:'#1F1D1A', mu:'#6A655C', ac:'#B45F0E', af:'#FFFFFF', ln:'#0F7C78', ok:'#1F8A4C', wa:'#A86A00', da:'#C42B2B', inn:'#2F5BD3', le:'#7A4BD1' };
    const F = (id,l,s,t,n,ph=false) => ({ id, l, s, t, n, nS: n?'flex':'none', ph, li: t===P, w: ph?'412px':'1440px', h: ph?'915px':'900px', r: ph?'28px':'12px' });
    const sections = [
      { k:'R5 · 5 · NOT ACTIVE (NOW)', t:'Passcode only, with a quiet note', d:'The note says what is coming but offers nothing to click.', frames:[
        F('R5-27A','Unlock · passcode + “Accounts are coming”','unlock',L,'Same passcode flow as today. One muted line under it, no links.'),
        F('R5-27B','Settings › Account · profile + coming soon · Paper','settings-off',P,'Name, avatar, language and time zone already exist locally and are editable. The dashed card lists what sign-in will add and is clearly labelled “Coming soon”.'),
        F('R5-27C','Phone · unlock','unlock',L,'',true),
        F('R5-27D','Phone · Settings › Account','settings-off',P,'',true)
      ]},
      { k:'R5 · 5 · ACTIVE (LATER) · SIGN-IN', t:'Welcome, sign in, register', d:'Google button follows Google\'s branding (white, grey outline, official G mark — placeholder here). Passcode stays for the owner.', frames:[
        F('R5-27E','Sign in','signin',L,'Continue with Google first, then email + password, then a magic link. “Use a passcode instead” sits quietly at the bottom.'),
        F('R5-27F','Register · strength meter + terms · Paper','register',P,'Meter in four segments: red weak, amber fair, green strong. The hint says how to improve, not just a score.'),
        F('R5-27G','Check your inbox','verify',L,'Resend unlocks after a short countdown.'),
        F('R5-27H','Email verified · Paper','verified',P,'')
      ]},
      { k:'R5 · 5 · ACTIVE · RECOVERY & ERRORS', t:'Forgot password, expired links, Google errors', d:'Every error says what happened, that nothing changed, and one way forward.', frames:[
        F('R5-27I','Forgot password','forgot',L,''),
        F('R5-27J','Reset link sent · Paper','reset-sent',P,''),
        F('R5-27K','Google consent cancelled','google-error',L,''),
        F('R5-27L','Link expired · Paper','expired',P,'')
      ]},
      { k:'R5 · 5 · ACTIVE · PROFILE', t:'Profile, sessions, danger zone', d:'Avatar is a glyph tile (space-icon picker) or a photo, round.', frames:[
        F('R5-27M','Profile · sign-in methods · sessions','profile',L,'Verified badge on the email. Google can be unlinked only if another method exists. Sign out everywhere ends every session except this one.'),
        F('R5-27N','Delete account · typed confirmation · Paper','delete',P,'The button stays disabled until the phrase matches exactly. Export is offered right above it.'),
        F('R5-27O','Phone · sign in','signin',L,'',true),
        F('R5-27P','Phone · register · Paper','register',P,'',true),
        F('R5-27Q','Phone · verify','verify',L,'',true),
        F('R5-27R','Phone · profile','profile',L,'',true),
        F('R5-27S','Phone · delete · Paper','delete',P,'',true),
        F('R5-27T','Phone · Google error','google-error',L,'',true)
      ]}
    ];
    return { sections };
  }
}
</script>
</body>
</html>
