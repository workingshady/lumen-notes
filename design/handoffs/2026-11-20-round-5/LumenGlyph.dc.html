<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./lumen-glyphs.js"></script></helmet><span style="display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:{{ box }};height:{{ box }};border-radius:{{ radius }};background:{{ tileBg }};color:{{ color }};font:600 {{ fs }} Inter,system-ui,sans-serif;letter-spacing:-.02em">{{ text }}<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" style="display:{{ svgShow }};overflow:visible"><sc-for list="{{ paths }}" as="p" hint-placeholder-count="2"><path d="{{ p.d }}" style="fill:{{ p.fill }};stroke:{{ p.stroke }};stroke-width:{{ sw }};stroke-linecap:round;stroke-linejoin:round"></path></sc-for></svg></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;glyph&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;lesson&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:24,&quot;tsType&quot;:&quot;number&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E8E6E1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tile&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;initials&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stroke&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1.75,&quot;tsType&quot;:&quot;number&quot;},&quot;tileScale&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1.75,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  componentDidMount() { if (!window.LUMEN_GLYPHS) { const t = setInterval(() => { if (window.LUMEN_GLYPHS) { clearInterval(t); this.forceUpdate(); } }, 50); setTimeout(() => clearInterval(t), 5000); } }
  renderVals() {
    const GL = window.LUMEN_GLYPHS || {};
    const size = this.props.size ?? 20, tile = this.props.tile, initials = this.props.initials || '';
    const def = GL[this.props.glyph ?? 'note'] || GL.note || [];
    const paths = initials ? [] : def.map(p => typeof p === 'string' ? { d: p, fill: 'none', stroke: 'currentColor' } : { d: p.d, fill: p.fill ? 'currentColor' : 'none', stroke: p.stroke || (p.fill ? 'none' : 'currentColor') });
    const box = tile ? Math.round(size * (this.props.tileScale ?? 1.75)) : size;
    return { size, paths, sw: this.props.stroke ?? 1.75, color: this.props.color ?? 'currentColor', box: box + 'px',
      radius: tile ? Math.round(box * 0.28) + 'px' : '0', tileBg: tile ? `color-mix(in srgb, ${tile} 14%, transparent)` : 'transparent',
      text: initials, svgShow: initials ? 'none' : 'block', fs: Math.round(size * 0.62) + 'px' };
  }
}
</script>
</body>
</html>
